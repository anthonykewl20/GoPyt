name: language-validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  language:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[security]'
      - name: Language regression suite
        timeout-minutes: 15
        run: python -u -m unittest discover -s gopyt -t . -v
      - run: python -m unittest benchmarks.language_guard.calibration.test_boundary_probe
      - run: python tools/check_stdlib_sync.py
      - run: python examples/ticket_contracts/demo.py
      - run: python -m pip wheel --no-deps . --wheel-dir dist
      - run: python tools/wheel_smoke.py dist/gopyt-0.1.0-py3-none-any.whl
      - name: Installed compiler/runtime upgrade and rollback
        run: |
          git fetch --depth 1 origin 710152358087dcf0b7e171f22a7f9a0eed557a01
          mkdir -p "$RUNNER_TEMP/gopyt-baseline" "$RUNNER_TEMP/gopyt-old-wheel"
          git archive 710152358087dcf0b7e171f22a7f9a0eed557a01 gopyt pyproject.toml README.md | tar -x -C "$RUNNER_TEMP/gopyt-baseline"
          python -m pip wheel --no-deps "$RUNNER_TEMP/gopyt-baseline" --wheel-dir "$RUNNER_TEMP/gopyt-old-wheel"
          python tools/upgrade_smoke.py "$RUNNER_TEMP/gopyt-old-wheel/gopyt-0.1.0-py3-none-any.whl" dist/gopyt-0.1.0-py3-none-any.whl
